#
# The `x-idealyst` block below records which idealyst-managed services are
# enabled — do not edit it by hand.
x-idealyst:
  version: 1
  services:
  - id: database
    variant: postgres
  - id: minio
  - id: playwright
  - id: claude
    variant: volume
  - id: idealyst-cli
  devcontainer:
    post_create:
    - idealyst-claude-install
    - idealyst-claude-chown
    - idealyst-cli-install
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
    - idealyst-database-data:/var/lib/postgresql/data
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
    - idealyst-minio-data:/data
  playwright:
    image: mcr.microsoft.com/playwright/mcp
    restart: unless-stopped
    init: true
    shm_size: 2gb
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8931'
    - --allowed-hosts
    - playwright:8931
  dev:
    environment:
      DATABASE_URL: postgres://app:app@database:5432/app
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      PLAYWRIGHT_MCP_URL: http://playwright:8931/mcp
      CLAUDE_CONFIG_DIR: /idealyst/agents/claude
    volumes:
    - idealyst-claude-config:/idealyst/agents/claude
    - idealyst-cli-cache:/idealyst/cli
    depends_on:
    - database
    - minio
    - playwright
volumes:
  idealyst-database-data: null
  idealyst-minio-data: null
  idealyst-claude-config: null
  idealyst-cli-cache: null
