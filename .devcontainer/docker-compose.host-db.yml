# Host-side override — publishes the devcontainer's postgres and MinIO
# on distinct host ports so host-run tests and a host-run `mcpm-web`
# can reach them without colliding with other projects' services
# (5432/5433 and 9000/9100 are taken by others).
#
# Usage (sidecars only, from the repo root):
#   docker compose -p control-center-devc \
#     -f .devcontainer/docker-compose.yml \
#     -f .devcontainer/docker-compose.idealyst.yml \
#     -f .devcontainer/docker-compose.host-db.yml \
#     up -d database minio
#
# Then, for attachments from a host-run mcpm-web / mcpm-mcp:
#   MCPM_S3_ENDPOINT=http://localhost:59000 \
#   MCPM_S3_ACCESS_KEY=minioadmin MCPM_S3_SECRET_KEY=minioadmin
#
# Not referenced by devcontainer.json — inside the container the app
# reaches the database as database:5432 and MinIO as minio:9000 (the
# idealyst compose exports MINIO_* for it) and needs no published port.
services:
  database:
    ports:
      - "55432:5432"
  minio:
    ports:
      - "59000:9000"
      - "59001:9001"
