# mcpm-mcp — the Control Center MCP server.
#
# The entire agent-facing product surface: 15 tools, the manager/worker
# briefing prompts, and read-only resources, served as newline-delimited
# JSON-RPC over stdio (the MCP stdio transport). Every domain rule lives
# in mcpm-core; this binary is protocol plumbing plus tool schemas.
[package]
name = "mcpm-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
mcpm-core = { path = "../mcpm-core" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# The HTTP transport (`--http`): the shared listener remote agents
# connect to. Stdio needs none of this, but the binary is one artifact
# and a feature flag on the transport would mean the deployed server and
# the locally tested one are different programs.
axum = "0.7"
chrono = "0.4"
