# mcpm-core — Control Center project-management domain + store.
#
# The gatekeeper logic from the architecture doc lives here: stage
# gating, exclusive module claims, checklist-proven completion, the
# append-only event ledger, and scoped memory search. Storage is
# Postgres (the devcontainer's `database` service); every invariant is
# enforced inside a transaction in this crate, never in the callers.
[package]
name = "mcpm-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# The event stream: `async_stream` to write `watch_events` as a
# generator, `futures-core`/`futures-util` for the Stream trait it
# returns and the adapter that drives PgListener.
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
# API-key credentials: OS randomness to mint a token, SHA-256 to store
# only its digest. `rand` is used through `OsRng` on purpose — a
# thread-local PRNG is not what you seed a credential from.
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Postgres. `tls-rustls` is NOT optional: every managed Postgres
# requires TLS (RDS ships `rds.force_ssl=1`, and Cloud SQL, Azure
# Database, Neon and Supabase all demand it), and a client built
# without it cannot negotiate — it is refused before `sslmode` is ever
# consulted, with a `pg_hba.conf` message that reads like a firewall
# problem. The devcontainer path is unaffected: sqlx defaults to
# `sslmode=prefer`, so a TLS-capable client still connects to the plain
# TCP sidecar.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
    # The co-touch batch stamp is a UUID column.
    "uuid",
] }
thiserror = "2"
# The object store behind attachments: S3, or MinIO in the devcontainer.
# `rust-s3` rather than the AWS SDK because every S3-compatible store
# speaks the same signed-request protocol, and a hundred crates of
# smithy runtime is a lot to compile for put/get/delete/presign. Same
# TLS stack as sqlx (rustls), no native-tls — see the sqlx note above.
# `fail-on-err` turns a non-2xx from the store into an `Err` instead of
# a success-shaped response carrying an error body.
s3 = { package = "rust-s3", version = "0.37", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
hex = "0.4"
# The event fan-out: one listener task, a broadcast to every subscriber.
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
